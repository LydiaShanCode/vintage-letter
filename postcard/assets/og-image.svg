<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7a072"/>
      <stop offset="1" stop-color="#e2557a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3c2814" flood-opacity="0.28"/>
    </filter>
    <pattern id="lines" width="10" height="36" patternUnits="userSpaceOnUse">
      <rect width="10" height="1" y="35" fill="#000" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#f4ecdf"/>
  <circle cx="160" cy="80" r="260" fill="#fff" fill-opacity="0.45"/>

  <g transform="translate(150 95) rotate(-4 450 220)" filter="url(#shadow)">
    <rect width="900" height="440" rx="10" fill="#fffaf1"/>
    <rect width="900" height="440" rx="10" fill="url(#lines)"/>
    <rect width="900" height="10" fill="url(#sky)"/>
    <line x1="520" y1="60" x2="520" y2="390" stroke="#d6c6ab" stroke-width="2"/>
    <text x="60" y="165" font-family="Georgia, serif" font-size="96" font-style="italic" font-weight="700" fill="#2f2a24">You've got</text>
    <text x="60" y="275" font-family="Georgia, serif" font-size="96" font-style="italic" font-weight="700" fill="#2f2a24">a postcard</text>
    <text x="62" y="350" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#7a6d5d">Tap to open it</text>

    <rect x="720" y="50" width="130" height="160" fill="#fff" stroke="#d6c6ab" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="732" y="62" width="106" height="136" fill="url(#sky)"/>
    <circle cx="800" cy="105" r="18" fill="#fff" fill-opacity="0.6"/>
    <circle cx="690" cy="200" r="72" fill="none" stroke="#2f2a24" stroke-opacity="0.4" stroke-width="4"/>
    <path d="M610 190 q20 -14 40 0 t40 0 t40 0 t40 0" fill="none" stroke="#2f2a24" stroke-opacity="0.4" stroke-width="4"/>

    <line x1="580" y1="300" x2="850" y2="300" stroke="#d6c6ab" stroke-width="2"/>
    <line x1="580" y1="360" x2="850" y2="360" stroke="#d6c6ab" stroke-width="2"/>
  </g>
</svg>
