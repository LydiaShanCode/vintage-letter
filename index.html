<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
    <title>A Letter</title>
  </head>
  <body>
    <div class="stage">
      <div class="book-stage">
        <div class="book-shadow" id="book-shadow"></div>
        <div class="book" id="book" data-spread="0" aria-label="A letter booklet"></div>
      </div>
      <nav class="controls" aria-label="Playback">
        <button type="button" class="control" id="toggle-play" aria-pressed="true">[pause]</button>
        <button type="button" class="control" id="restart">[Back to beginning]</button>
      </nav>
    </div>
    <div class="grain" aria-hidden="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
