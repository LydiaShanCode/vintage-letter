<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
    <title>A Letter</title>
    <script type="module" crossorigin src="/vintage-letter/assets/index-BYoRONbb.js"></script>
    <link rel="stylesheet" crossorigin href="/vintage-letter/assets/index-CNQV3fIz.css">
  </head>
  <body>
    <div class="stage">
      <div class="book-stage">
        <div class="book-shadow" id="book-shadow"></div>
        <div class="book" id="book" data-spread="0" aria-label="A letter booklet"></div>
      </div>
      <nav class="controls" aria-label="Playback">
        <button type="button" class="control" id="play" aria-label="Play" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5.5v13l11-6.5z" />
          </svg>
        </button>
        <button type="button" class="control" id="pause" aria-label="Pause" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6.5" y="5.5" width="3.5" height="13" />
            <rect x="14" y="5.5" width="3.5" height="13" />
          </svg>
        </button>
        <button type="button" class="control" id="restart" aria-label="Restart">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7.2 7.2A7 7 0 1 1 6 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <path d="M7.2 3.8v4.6H11.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </nav>
    </div>
    <div class="grain" aria-hidden="true"></div>
  </body>
</html>
